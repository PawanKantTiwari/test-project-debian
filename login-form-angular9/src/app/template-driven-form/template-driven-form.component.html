<h2>Login</h2>

<form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">
  <div>
    <label for="email">Email</label>
    <input
      id="email"
      type="email"
      name="email"
      ngModel
      required
      email
    />
  </div>

  <div>
    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      name="password"
      ngModel
      required
      minlength="6"
    />
  </div>

  <button type="submit" [disabled]="loginForm.invalid">
    Login
  </button>
</form>
